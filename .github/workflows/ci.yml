name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.34.7
      - name: Install video inspection tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.bun/install/cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Generate an isolated build secret
        run: printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: node scripts/check.mjs --full
